name: Add-on APK

# Builds one add-on and publishes its release APK as a build artifact, so a TV owner can sideload it
# without a JDK or Android SDK on their own machine:
#
#   gh workflow run "Add-on APK" -f addon=weather
#   gh run watch
#   gh run download <run id> -n weather-apk -D out
#
# Kept apart from CI and addons.yml on purpose: nothing here runs on a push or a pull request, so it
# never blocks a merge or holds up the launcher's size gate. The APK is a workflow artifact, not a
# release: this repo ships no prebuilt binaries in the tree (AGENTS.md, "Hard rules").
on:
  workflow_dispatch:
    inputs:
      addon:
        description: Folder under addons/ to build (e.g. weather, prayer-times, sleep-timer)
        required: true
        default: weather

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.addon }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - name: Check the add-on exists and has a Gradle wrapper
        env:
          ADDON: ${{ inputs.addon }}
        run: |
          case "$ADDON" in
            */*|.*|"") echo "::error::addon must be one folder name under addons/"; exit 1 ;;
          esac
          [ -f "addons/$ADDON/gradlew" ] || { echo "::error::addons/$ADDON has no gradlew"; exit 1; }
      - name: Unit tests and release build
        env:
          ADDON: ${{ inputs.addon }}
          # An add-on that needs a key of its own reads it from here (the weather add-on's
          # OPENWEATHER_API_KEY). Unset, its build still succeeds and the app says the key is missing.
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          cd "addons/$ADDON"
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - name: Show the APK
        env:
          ADDON: ${{ inputs.addon }}
        run: |
          apk=$(ls "addons/$ADDON"/app/build/outputs/apk/release/*.apk)
          ls -l "$apk"
          sha256sum "$apk" | tee /tmp/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.addon }}-apk
          path: addons/${{ inputs.addon }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
