plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.sumyabazar1.weather'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.sumyabazar1.weather'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.1-owm'

        // The OpenWeatherMap key, from the Gradle property or the environment variable OPENWEATHER_API_KEY, and
        // PLACEHOLDER when neither is set so the build never fails and a key never lives in a tracked file:
        //   ./gradlew assembleDebug -POPENWEATHER_API_KEY=...   or   OPENWEATHER_API_KEY=... ./gradlew assembleDebug
        // It reaches the app as the string resource weather_api_key and as BuildConfig.WEATHER_API_KEY.
        def owmKey = (project.findProperty('OPENWEATHER_API_KEY') ?: System.getenv('OPENWEATHER_API_KEY') ?: 'PLACEHOLDER').toString().trim()
        if (!owmKey) owmKey = 'PLACEHOLDER'
        resValue 'string', 'weather_api_key', owmKey
        buildConfigField 'String', 'WEATHER_API_KEY', '"' + owmKey + '"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded over ADB like the launcher: signed with the debug key. Sign your own releases with your key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Test only (never in the APK): plain JVM tests for the code and AQI tables, src/test.
    testImplementation 'junit:junit:4.13.2'
}
