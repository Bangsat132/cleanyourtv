plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.cleanyourtv.dynamicwallpaper'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.cleanyourtv.dynamicwallpaper'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
        // The city and its coordinates are in res/values/options.xml: Palembang, South Sumatra by default.
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded over ADB like the launcher: signed with the debug key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Test only (never in the APK): the weather-code to mood table, src/test.
    testImplementation 'junit:junit:4.13.2'
}
